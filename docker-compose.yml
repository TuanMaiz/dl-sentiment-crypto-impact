version: "2.2"
services:
  jobmanager:
    # image: pyflink:2.1.0
    build:
      context: .
      dockerfile: dockerfile
    container_name: jobmanager
    volumes:
      - ./:/home/pyflink
    ports:
      - "8085:8081"
    command: jobmanager
    environment:
      - |
        FLINK_PROPERTIES=
        jobmanager.rpc.address: jobmanager
  taskmanager:
    # image: pyflink:2.1.0
    build:
      context: .
      dockerfile: dockerfile
    container_name: taskmanager
    depends_on:
      - jobmanager
    command: taskmanager
    scale: 1
    environment:
      - |
        FLINK_PROPERTIES=
        jobmanager.rpc.address: jobmanager
        taskmanager.numberOfTaskSlots: 2
